name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm test

      - name: Verify tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Build release files
        id: pack
        run: |
          package_file="$(npm pack --json | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => process.stdout.write(JSON.parse(input)[0].filename))")"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/magic-edit.js
          "${{ steps.pack.outputs.package_file }}"
          --verify-tag
          --generate-notes

      - name: Publish to npm with trusted publishing
        if: ${{ vars.NPM_TRUSTED_PUBLISHING == 'enabled' }}
        run: npm publish
